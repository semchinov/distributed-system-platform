[project]
name = "service-b-python"
version = "0.1.0"
description = "Demonstrates basic service-to-service communication with observability."
authors = [
    {name = "m.semchinov@edu.centraluniversity.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "opentelemetry-api (>=1.39.1,<2.0.0)",
    "opentelemetry-sdk (>=1.39.1,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.39.1,<2.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "opentelemetry-instrumentation-fastapi (>=0.60b1,<0.61)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
